<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Tensile Testing Working Model - Stress & Strain</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a24;
      color: #e2e8f0;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #dashboard {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 320px;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h2 {
      margin: 0 0 12px 0;
      font-size: 1.1rem;
      color: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }
    select, input[type=range] {
      width: 100%;
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 6px;
      outline: none;
      box-sizing: border-box;
      font-size: 0.9rem;
    }
    .metrics-panel {
      margin-top: 14px;
      background: #0b0f19;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.82rem;
      border-left: 3px solid #38bdf8;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
    .metric-val {
      font-weight: 600;
      font-family: monospace;
      color: #f1f5f9;
    }
    #status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #10b981;
      color: #022c22;
    }
    #instruction {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.8);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #cbd5e1;
      pointer-events: none;
    }
  </style>
  <!-- Three.js & OrbitControls from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="dashboard">
    <h2>Tensile Rig Controller</h2>
    
    <div class="control-group">
      <label for="material-select">Select Test Material:</label>
      <select id="material-select">
        <option value="wire">Paper-Clip Wire (Ductile Steel)</option>
        <option value="rubber">Rubber Band (Elastomer)</option>
        <option value="plastic">Plastic Strip (LDPE Polymer)</option>
        <option value="chalk">Chalk Stick (Brittle Ceramic)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="load-slider">Add Hanging Load / Sand (Force $P$): <span id="load-display">0 N</span></label>
      <input type="range" id="load-slider" min="0" max="250" step="1" value="0">
    </div>

    <div class="metrics-panel">
      <div class="metric-row">
        <span>Force ($P$):</span>
        <span class="metric-val" id="val-p">0.00 N</span>
      </div>
      <div class="metric-row">
        <span>Elongation ($\Delta L$):</span>
        <span class="metric-val" id="val-dl">0.00 mm</span>
      </div>
      <div class="metric-row">
        <span>Eng. Strain ($\varepsilon$):</span>
        <span class="metric-val" id="val-eps">0.0000</span>
      </div>
      <div class="metric-row">
        <span>Eng. Stress ($\sigma$):</span>
        <span class="metric-val" id="val-sigma">0.00 MPa</span>
      </div>
      <div class="metric-row">
        <span>Young's Modulus ($E$):</span>
        <span class="metric-val" id="val-e">--</span>
      </div>
    </div>

    <div id="status-badge">State: Elastic</div>
  </div>

  <div id="instruction">Left click & drag to rotate | Scroll to zoom | Right click to pan</div>

  <script>
    // --- 1. Scene, Camera, Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181822);
    scene.fog = new THREE.FogExp2(0x181822, 0.04);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.8, 1.2, 3.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0, 0);

    // --- 2. Lighting ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(4, 6, 4);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0x38bdf8, 0.3);
    backLight.position.set(-4, -2, -3);
    scene.add(backLight);

    // --- 3. Material Properties & Constants ---
    const MATERIALS = {
      wire: {
        name: "Paper-Clip Wire",
        L0: 100, // mm
        A0: 0.785, // mm^2 (d=1mm)
        E_GPa: 190,
        yieldStress: 140, // MPa
        utsStress: 210, // MPa
        fractureStrain: 0.12,
        color: 0x94a3b8,
        shape: 'cylinder',
        radius: 0.015,
        maxLoad: 175
      },
      rubber: {
        name: "Rubber Band",
        L0: 50,
        A0: 3.6, // mm^2 (3x1.2mm)
        E_GPa: 0.002, // 2 MPa initial
        yieldStress: 999, // Hyperelastic, no typical yield
        utsStress: 8.5,
        fractureStrain: 4.5, // 450%
        color: 0xf59e0b,
        shape: 'strip',
        width: 0.05,
        thickness: 0.02,
        maxLoad: 35
      },
      plastic: {
        name: "Plastic Bag Strip",
        L0: 60,
        A0: 0.5, // mm^2
        E_GPa: 0.35, // 350 MPa
        yieldStress: 18,
        utsStress: 26,
        fractureStrain: 1.8, // cold drawing
        color: 0x38bdf8,
        shape: 'strip',
        width: 0.06,
        thickness: 0.008,
        maxLoad: 14
      },
      chalk: {
        name: "Chalk Stick",
        L0: 60,
        A0: 78.5, // mm^2 (d=10mm)
        E_GPa: 9.5,
        yieldStress: 2.2, // immediate brittle snap
        utsStress: 2.2,
        fractureStrain: 0.003,
        color: 0xf8fafc,
        shape: 'cylinder',
        radius: 0.08,
        maxLoad: 180
      }
    };

    let curMatKey = 'wire';
    let curMat = MATERIALS[curMatKey];

    // --- 4. Rig Geometry (Table, Clamp, Scale, Weights) ---
    const rigGroup = new THREE.Group();
    scene.add(rigGroup);

    // Benchtop Wooden Surface
    const benchGeo = new THREE.BoxGeometry(2.5, 0.15, 1.4);
    const benchMat = new THREE.MeshStandardMaterial({ color: 0x854d0e, roughness: 0.6 });
    const bench = new THREE.Mesh(benchGeo, benchMat);
    bench.position.set(-0.6, 0.85, 0);
    bench.receiveShadow = true;
    rigGroup.add(bench);

    // C-Clamp Frame
    const clampMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
    const clampBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.12), clampMat);
    clampBody.position.set(0.1, 0.95, 0);
    rigGroup.add(clampBody);

    const clampArmTop = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.12), clampMat);
    clampArmTop.position.set(0.2, 1.15, 0);
    rigGroup.add(clampArmTop);

    // Fixed Top Gripper
    const gripMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.4 });
    const topGrip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 0.08), gripMat);
    topGrip.position.set(0.32, 1.15, 0);
    rigGroup.add(topGrip);

    // Millimeter Measuring Scale Mounted Vertically
    const scaleBoard = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 1.6, 0.02),
      new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.9 })
    );
    scaleBoard.position.set(0.48, 0.35, 0);
    rigGroup.add(scaleBoard);

    // Scale graduation lines
    for (let i = 0; i <= 30; i++) {
      const isMajor = i % 5 === 0;
      const tick = new THREE.Mesh(
        new THREE.BoxGeometry(isMajor ? 0.04 : 0.02, 0.003, 0.025),
        new THREE.MeshBasicMaterial({ color: isMajor ? 0xd97706 : 0x0f172a })
      );
      tick.position.set(0.46, 1.05 - (i * 0.045), 0.005);
      rigGroup.add(tick);
    }

    // --- Dynamic Hanging Assembly ---
    const hangingGroup = new THREE.Group();
    rigGroup.add(hangingGroup);

    // Lower Grip
    const botGrip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.08), gripMat);
    botGrip.castShadow = true;
    hangingGroup.add(botGrip);

    // Extension Pointer Needle
    const pointer = new THREE.Mesh(
      new THREE.ConeGeometry(0.02, 0.12, 8),
      new THREE.MeshStandardMaterial({ color: 0xef4444 })
    );
    pointer.rotation.z = -Math.PI / 2;
    pointer.position.set(0.08, 0, 0);
    hangingGroup.add(pointer);

    // Suspension Cord
    const cordGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.35);
    const cord = new THREE.Mesh(cordGeo, clampMat);
    cord.position.set(0, -0.22, 0);
    hangingGroup.add(cord);

    // Load Bucket
    const bucketGeo = new THREE.CylinderGeometry(0.14, 0.1, 0.28, 24);
    const bucketMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.1, roughness: 0.2, transparent: true, opacity: 0.85 });
    const bucket = new THREE.Mesh(bucketGeo, bucketMat);
    bucket.position.set(0, -0.45, 0);
    bucket.castShadow = true;
    hangingGroup.add(bucket);

    // Sand/Weight Load inside bucket
    const sandGeo = new THREE.CylinderGeometry(0.13, 0.09, 0.24, 20);
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 1.0 });
    const sand = new THREE.Mesh(sandGeo, sandMat);
    sand.position.set(0, -0.47, 0);
    hangingGroup.add(sand);

    // --- Dynamic Test Specimen Mesh ---
    let specimenMesh = null;
    const initialGripY = 1.08;
    const initialLengthVisual = 0.55; // base 3D unit length

    function rebuildSpecimenMesh() {
      if (specimenMesh) rigGroup.remove(specimenMesh);
      let geo;
      if (curMat.shape === 'cylinder') {
        geo = new THREE.CylinderGeometry(curMat.radius, curMat.radius, initialLengthVisual, 24);
      } else {
        geo = new THREE.BoxGeometry(curMat.width, initialLengthVisual, curMat.thickness);
      }
      const mat = new THREE.MeshStandardMaterial({
        color: curMat.color,
        roughness: 0.4,
        metalness: curMatKey === 'wire' ? 0.7 : 0.05
      });
      specimenMesh = new THREE.Mesh(geo, mat);
      specimenMesh.castShadow = true;
      rigGroup.add(specimenMesh);
      updateSpecimenPosition(0, 1.0);
    }

    function updateSpecimenPosition(elongationVisual, neckScaleX) {
      const newLen = initialLengthVisual + elongationVisual;
      specimenMesh.scale.set(neckScaleX, newLen / initialLengthVisual, neckScaleX);
      specimenMesh.position.set(0.32, initialGripY - (newLen / 2), 0);
      hangingGroup.position.set(0.32, initialGripY - newLen, 0);
    }

    rebuildSpecimenMesh();

    // --- 5. Mechanics & Physics Engine ---
    const loadSlider = document.getElementById('load-slider');
    const loadDisplay = document.getElementById('load-display');
    const valP = document.getElementById('val-p');
    const valDL = document.getElementById('val-dl');
    const valEps = document.getElementById('val-eps');
    const valSigma = document.getElementById('val-sigma');
    const valE = document.getElementById('val-e');
    const badge = document.getElementById('status-badge');
    const matSelect = document.getElementById('material-select');

    matSelect.addEventListener('change', (e) => {
      curMatKey = e.target.value;
      curMat = MATERIALS[curMatKey];
      loadSlider.max = curMat.maxLoad;
      loadSlider.value = 0;
      rebuildSpecimenMesh();
      evaluateMechanics(0);
    });

    loadSlider.addEventListener('input', (e) => {
      const load = parseFloat(e.target.value);
      evaluateMechanics(load);
    });

    function evaluateMechanics(P_Newtons) {
      loadDisplay.innerText = P_Newtons + " N";
      valP.innerText = P_Newtons.toFixed(2) + " N";

      // Engineering Stress: sigma = P / A0 (MPa)
      const sigma = P_Newtons / curMat.A0;
      valSigma.innerText = sigma.toFixed(2) + " MPa";

      let strain = 0;
      let state = "Elastic";
      let badgeBg = "#10b981"; // green
      let neckFactor = 1.0;
      let isFractured = false;

      // Realistic constitutive response models
      if (curMatKey === 'wire') {
        const yieldStress = curMat.yieldStress;
        const uts = curMat.utsStress;
        if (sigma <= yieldStress) {
          strain = (sigma * 1e6) / (curMat.E_GPa * 1e9);
          state = "Linear Elastic (Hooke's Law)";
        } else if (sigma <= uts) {
          strain = 0.0008 + Math.pow((sigma - yieldStress) / 80, 2.2);
          state = "Plastic Yielding & Strain Hardening";
          badgeBg = "#f59e0b"; // yellow
        } else {
          strain = curMat.fractureStrain;
          isFractured = true;
          state = "Cup-and-Cone Fracture";
          badgeBg = "#ef4444"; // red
        }
        valE.innerText = (curMat.E_GPa).toFixed(1) + " GPa";
      } 
      else if (curMatKey === 'rubber') {
        // Non-linear hyperelastic S-curve
        strain = Math.pow(P_Newtons / 8.0, 1.4) * 0.45;
        if (strain > curMat.fractureStrain) {
          isFractured = true;
          state = "Rupture (Snap)";
          badgeBg = "#ef4444";
        } else {
          state = strain > 0.8 ? "Chain Alignment Stiffening" : "Reversible Hyperelastic";
          badgeBg = "#06b6d4";
        }
        const tangentE = (sigma / Math.max(strain, 0.001));
        valE.innerText = tangentE.toFixed(2) + " MPa (Tangent)";
      } 
      else if (curMatKey === 'plastic') {
        if (sigma <= curMat.yieldStress) {
          strain = (sigma * 1e6) / (curMat.E_GPa * 1e9);
          state = "Elastic";
        } else if (sigma <= curMat.utsStress) {
          strain = 0.05 + (sigma - curMat.yieldStress) * 0.18;
          neckFactor = 0.65; // cold drawing neck down
          state = "Localized Necking & Cold Drawing";
          badgeBg = "#8b5cf6";
        } else {
          isFractured = true;
          state = "Rupture";
          badgeBg = "#ef4444";
        }
        valE.innerText = (curMat.E_GPa * 1000).toFixed(0) + " MPa";
      } 
      else if (curMatKey === 'chalk') {
        if (sigma < curMat.utsStress) {
          strain = (sigma * 1e6) / (curMat.E_GPa * 1e9);
          state = "Brittle Elastic";
        } else {
          strain = curMat.fractureStrain;
          isFractured = true;
          state = "Brittle Cleavage Snap (Zero Yield)";
          badgeBg = "#ef4444";
        }
        valE.innerText = curMat.E_GPa.toFixed(1) + " GPa";
      }

      const deltaL_mm = strain * curMat.L0;
      valDL.innerText = deltaL_mm.toFixed(2) + " mm";
      valEps.innerText = strain.toFixed(4);

      badge.innerText = "State: " + state;
      badge.style.background = badgeBg;
      badge.style.color = (badgeBg === "#f59e0b" || badgeBg === "#10b981") ? "#022c22" : "#ffffff";

      // 3D Visual Update
      sand.scale.set(1, Math.min(1.0, 0.15 + (P_Newtons / curMat.maxLoad) * 0.85), 1);

      if (isFractured) {
        // Snap/drop animation offset
        specimenMesh.visible = false;
        hangingGroup.position.y = -0.6; // falls to catch plate
      } else {
        specimenMesh.visible = true;
        // Map strain to 3D visual length scale
        const visualStretch = (deltaL_mm / curMat.L0) * initialLengthVisual;
        updateSpecimenPosition(visualStretch, neckFactor);
      }
    }

    // --- 6. Render Loop & Resize Handling ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
